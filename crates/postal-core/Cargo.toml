[package]
name = "postal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WhatsApp protocol core for Postal, built on whatsapp-rust"

[features]
wire-types = ["dep:ts-rs"]

[dependencies]
url = "2"
ts-rs = { workspace = true, optional = true }
whatsapp-rust = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
fs4 = "1.1"
# Renders the pairing QR to the terminal. Kept in-crate so the spike has no
# system dependency like `qrencode`.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The UI consumes these types directly over Tauri IPC.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
diesel = { version = "2.3.11", default-features = false, features = ["sqlite"] }
# Fetches Open Graph metadata for link previews on outgoing messages.
ureq = "3"
# Renders outgoing image thumbnails so recipients see a preview before the
# file finishes downloading.
buffa = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Received thumbnails are kept in the row as `data:` URIs.
base64 = "0.23"
# Sticker files are addressed by the SHA-256 of their bytes (app-state filehash).
sha2 = "0.11"
# Decodes any stored audio to PCM WAV for playback, so the web view never
# depends on system codecs (Linux GStreamer ships without AAC, for one).
symphonia = { version = "0.6", features = [
    "aac", "alac", "flac", "mp3", "pcm", "vorbis",
    "isomp4", "ogg", "wav",
] }
# Ogg Opus voice notes: symphonia has no Opus, and WhatsApp PTT is Ogg Opus.
opus-pure = "0.2"

[dev-dependencies]
flate2 = "1"

# Media Foundation decodes the first frame of outgoing videos for their preview.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Shell"] }
