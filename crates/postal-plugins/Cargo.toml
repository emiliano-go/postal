[package]
name = "postal-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
wire-types = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "postal-fake-plugin"
path = "tests/support/fake.rs"
test = false
