name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental builds.
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --experimental-strip-types src/lib/utils/phone.ts
      - run: node --experimental-strip-types src/lib/utils/format.ts
      - id: frontend_coverage_test
        if: runner.os == 'Linux'
        env:
          NODE_V8_COVERAGE: ${{ runner.temp }}/frontend-coverage
        run: |
          node --experimental-test-coverage --experimental-strip-types --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination="${RUNNER_TEMP}/frontend.lcov" \
            "src/tests/**/*.test.ts"
      - if: always() && runner.os == 'Linux'
        run: |
          if [ -f "${RUNNER_TEMP}/frontend.lcov" ]; then
            node scripts/coverage-summary.mjs Frontend "${RUNNER_TEMP}/frontend.lcov"
            echo '_Node coverage tracks loaded TypeScript modules; Svelte components are outside this report._' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Frontend coverage unavailable: tests did not produce LCOV.' >> "$GITHUB_STEP_SUMMARY"
            if [ '${{ steps.frontend_coverage_test.outcome }}' = 'success' ]; then exit 1; fi
          fi
      - if: runner.os != 'Linux'
        run: pnpm test
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            ${{ runner.temp }}/frontend.lcov
            ${{ runner.temp }}/frontend-coverage/
          if-no-files-found: warn
      # Fails when a production Rust function grows past 80 lines.
      - run: pnpm check:fn-length
      # Fails when a Tauri command misses its build.rs or ACL wiring.
      - run: pnpm check:tauri-acl

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      # .cargo/config.toml links with lld on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld ffmpeg
      - if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview
      - id: core_coverage_test
        if: runner.os == 'Linux'
        run: node scripts/cargo.mjs llvm-cov --locked --workspace
      - if: always() && runner.os == 'Linux'
        run: |
          if node scripts/cargo.mjs llvm-cov report --lcov --output-path target/core.lcov; then
            if [ '${{ steps.core_coverage_test.outcome }}' != 'success' ]; then
              echo '_Partial core coverage: tests did not pass._' >> "$GITHUB_STEP_SUMMARY"
            fi
            node scripts/coverage-summary.mjs Core target/core.lcov
          else
            echo 'Core coverage unavailable: no valid LLVM profile.' >> "$GITHUB_STEP_SUMMARY"
            if [ '${{ steps.core_coverage_test.outcome }}' = 'success' ]; then exit 1; fi
          fi
      - if: runner.os != 'Linux'
        run: node scripts/cargo.mjs test --locked --workspace
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path plugins/speech-to-text/Cargo.toml
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage
          path: target/core.lcov
          if-no-files-found: warn
      - run: sccache --show-stats

  tauri:
    name: Tauri shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The shell embeds the built frontend, so it has to exist before compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-transcription-helper.mjs
      # If Rust DTOs drift, run pnpm generate:wire and commit the generated files.
      - run: pnpm check:wire
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview
      - id: tauri_coverage_test
        if: runner.os == 'Linux'
        run: node scripts/cargo.mjs llvm-cov --locked --manifest-path src-tauri/Cargo.toml --features wire-types
      - if: always() && runner.os == 'Linux'
        run: |
          if node scripts/cargo.mjs llvm-cov report --manifest-path src-tauri/Cargo.toml --lcov --output-path src-tauri/target/tauri.lcov; then
            if [ '${{ steps.tauri_coverage_test.outcome }}' != 'success' ]; then
              echo '_Partial Tauri coverage: tests did not pass._' >> "$GITHUB_STEP_SUMMARY"
            fi
            node scripts/coverage-summary.mjs Tauri src-tauri/target/tauri.lcov
          else
            echo 'Tauri coverage unavailable: no valid LLVM profile.' >> "$GITHUB_STEP_SUMMARY"
            if [ '${{ steps.tauri_coverage_test.outcome }}' = 'success' ]; then exit 1; fi
          fi
      - if: runner.os != 'Linux'
        run: node scripts/cargo.mjs test --locked --manifest-path src-tauri/Cargo.toml --features wire-types
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-coverage
          path: src-tauri/target/tauri.lcov
          if-no-files-found: warn
      - run: sccache --show-stats
