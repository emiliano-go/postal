[package]
name = "postal-stt"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[dependencies]
postal-plugins = { path = "../../crates/postal-plugins" }
anyhow = "1"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "process", "sync", "time", "fs"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net"] }

[[bin]]
name = "postal-stt-fixture"
path = "tests/support/engine.rs"
test = false

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
