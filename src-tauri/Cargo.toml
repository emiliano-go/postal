[package]
name = "postal"
version = "0.1.0"
description = "Postal: a native WhatsApp client"
authors = ["emiliano-go"]
license = "MIT"
edition = "2021"
default-run = "postal"

[lib]
name = "postal_lib"
# Desktop only: rlib is all the binary needs. Tauri's mobile targets also want
# staticlib and cdylib, which cost a multi-gigabyte archive and a full shared
# link on every build; add them back the day mobile exists.
crate-type = ["rlib"]

[features]
wire-types = ["dep:ts-rs", "postal-core/wire-types", "postal-plugins/wire-types"]

[[bin]]
name = "postal-wire-types"
path = "src/bin/wire_types.rs"
required-features = ["wire-types"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
zeroize = "1"
getrandom = "0.4"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl"] }
# The native protocol client. This is what replaced the embedded WhatsApp Web
# webview, and with it the whole class of memory and history problems.
postal-core = { path = "../crates/postal-core" }
postal-plugins = { path = "../crates/postal-plugins" }
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Decodes attachment payloads arriving from the webview.
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
# `std::fs::canonicalize` returns `\\?\` paths on Windows, which the shell
# cannot open.
dunce = "1"
# Resolves the pre-rename bundle directories for the one-time data migration.
dirs = "6"
# A second launch exits and focuses the running window, so only one process
# owns the WhatsApp session. Pinned to 2.4: 2.5 wants tauri 2.12.
tauri-plugin-single-instance = "=2.4.1"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-clipboard-manager = "=2.3.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
env_logger = "0.11"
log = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "=4.18.1"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio"] }
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android", target_os = "ios"))))'.dependencies]
gtk = "=0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[profile.dev]
# Full debuginfo is what made the debug binary ~900 MB and every link slow;
# line tables are enough for readable backtraces. Dependencies carry none.
debug = 1
# Keep debuginfo out of the linked binary; the linker no longer packs it.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
# Thin LTO and parallel codegen keep the build around a minute instead of the
# several fat LTO with a single codegen unit took. The binary is a little
# bigger, which is the trade for iterating quickly on an install.
codegen-units = 16
lto = "thin"
opt-level = 3
# Kept: unwinding would leave poisoned state mutexes behind in a half-working
# app. The panic hook logs before the abort.
panic = "abort"
# Symbol names stay so the logged backtrace is readable.
strip = "debuginfo"
