<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pinned message stack</title></head>
  <body><div id="app"></div><script type="module">
    import { mount } from "svelte";
    import { applyTheme, BUILT_IN } from "$lib/utils/theme.svelte";
    import { locale } from "$lib/i18n/locale.svelte";
    import PinnedStackHarness from "./PinnedStackHarness.svelte";
    await locale.init();
    applyTheme(BUILT_IN.find((theme) => theme.id === "dark"));
    mount(PinnedStackHarness, { target: document.getElementById("app") });
  </script></body>
</html>
